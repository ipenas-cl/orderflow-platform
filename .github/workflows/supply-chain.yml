# Build -> SBOM -> scan -> sign -> promote by GitOps PR.
# Images come from the application repo (ipenas-cl/orderflow) at the commit
# pinned in release/orderflow.ref. Changing that file is itself a reviewed PR,
# so the build has no free-form inputs (SLSA: build is defined by the source).
name: supply-chain
on:
  push:
    branches: [main]
    paths: [release/orderflow.ref]
  workflow_dispatch: {}
permissions: { contents: read }
env:
  # Signed release images live under this repo so its GITHUB_TOKEN can push
  # them; ghcr.io/ipenas-cl/orderflow/* belongs to the app repo's own CI.
  REGISTRY: ghcr.io/ipenas-cl/orderflow-platform
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write          # keyless cosign (Fulcio) + provenance
      security-events: write   # Trivy SARIF upload
    strategy:
      fail-fast: true
      matrix:
        service: [orders, payments, inventory, fulfillment, admin, payprovider, devissuer]
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with: { path: platform, sparse-checkout: release }
      - id: ref
        run: echo "sha=$(tr -d '[:space:]' < platform/release/orderflow.ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ipenas-cl/orderflow
          ref: ${{ steps.ref.outputs.sha }}
      - id: meta
        run: echo "tag=sha-$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service == 'admin' && 'Dockerfile.admin' || 'Dockerfile' }}
          build-args: SERVICE=${{ matrix.service }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ matrix.service }}:${{ steps.meta.outputs.tag }}
          provenance: mode=max
          sbom: false
      - name: SBOM (SPDX, syft)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ matrix.service }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Trivy - fail on fixable HIGH/CRITICAL
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.1     # pin the scanner, not just the wrapper action
          scanners: vuln
          image-ref: ${{ env.REGISTRY }}/${{ matrix.service }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          limit-severities-for-sarif: true   # else SARIF ignores severity and any LOW trips the gate
          output: trivy.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif
          category: "trivy-${{ matrix.service }}"
          # the workspace holds the app repo checkout; attribute results to this repo's commit
          sha: ${{ github.sha }}
          ref: ${{ github.ref }}
      - name: Trivy findings (readable)
        if: failure()
        run: jq -r '.runs[].results[] | "\(.ruleId)  \(.message.text | split("\n")[0:3] | join(" "))"' trivy.sarif || true
      - uses: sigstore/cosign-installer@v3
      - name: Sign image and attest SBOM (keyless)
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.service }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$IMAGE"
          cosign verify "$IMAGE" \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/supply-chain.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
  promote:
    # Promotion is a pull request, never a direct push: dev auto-merges after
    # checks; staging and prod require review (CODEOWNERS + environment rules).
    needs: build
    runs-on: ubuntu-24.04
    permissions: { contents: write, pull-requests: write }
    strategy:
      max-parallel: 1
      matrix:
        env: [dev, staging, prod]
    environment: ${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: imranismail/setup-kustomize@v2
      - name: Bump image tags in the ${{ matrix.env }} overlay
        working-directory: gitops/orderflow/overlays/${{ matrix.env }}
        run: |
          for s in orders payments inventory fulfillment admin payprovider devissuer; do
            kustomize edit set image ghcr.io/ipenas-cl/orderflow/$s=${{ env.REGISTRY }}/$s:${{ needs.build.outputs.tag }}
          done
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: promote/${{ matrix.env }}/${{ needs.build.outputs.tag }}
          title: "promote ${{ needs.build.outputs.tag }} to ${{ matrix.env }}"
          commit-message: "gitops(${{ matrix.env }}): orderflow ${{ needs.build.outputs.tag }}"
          body: |
            Signed images (cosign keyless, this workflow), SBOM attested, Trivy clean for fixable HIGH/CRITICAL.
            Merging lets Argo CD start a canary gated by the SLO AnalysisTemplate; a failed analysis rolls back on its own.
          labels: promotion, ${{ matrix.env }}
