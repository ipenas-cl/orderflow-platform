apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-requests-limits
  annotations:
    policies.kyverno.io/description: Requests make scheduling and HPA honest; memory limits contain leaks.
spec:
  background: true
  rules:
    - name: requests-and-limits
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaceSelector:
                matchLabels: { policy.orderflow.dev/enforce: "true" }
      validate:
        failureAction: Enforce
        message: "cpu/memory requests and a memory limit are required."
        pattern:
          spec:
            containers:
              - resources:
                  requests: { cpu: "?*", memory: "?*" }
                  limits: { memory: "?*" }
