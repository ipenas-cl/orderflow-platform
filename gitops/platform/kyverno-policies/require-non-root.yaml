apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-non-root
  annotations:
    policies.kyverno.io/description: Containers must run as a non-root user without privilege escalation.
spec:
  background: true
  rules:
    - name: non-root
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaceSelector:
                matchLabels: { policy.orderflow.dev/enforce: "true" }
      validate:
        failureAction: Enforce
        message: "runAsNonRoot must be true and allowPrivilegeEscalation false (pod or container level)."
        pattern:
          spec:
            =(securityContext):
              =(runAsUser): ">0"
            containers:
              - securityContext:
                  allowPrivilegeEscalation: false
                  =(runAsUser): ">0"
    - name: run-as-non-root
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaceSelector:
                matchLabels: { policy.orderflow.dev/enforce: "true" }
      validate:
        failureAction: Enforce
        message: "runAsNonRoot must be true at pod or container level."
        anyPattern:
          - spec:
              securityContext:
                runAsNonRoot: true
              containers:
                - =(securityContext):
                    =(runAsNonRoot): true
          - spec:
              containers:
                - securityContext:
                    runAsNonRoot: true
