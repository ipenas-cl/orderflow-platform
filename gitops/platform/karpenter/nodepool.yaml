# Karpenter: on-demand for the stateful/critical tier is handled by the
# managed "system" node group; everything else lands here. Spot + on-demand
# mix across 3 AZs, consolidation on, 30-day node expiry (forced patching).
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: general
spec:
  template:
    spec:
      nodeClassRef: { group: karpenter.k8s.aws, kind: EC2NodeClass, name: general }
      requirements:
        - { key: karpenter.sh/capacity-type, operator: In, values: [spot, on-demand] }
        - { key: kubernetes.io/arch, operator: In, values: [arm64, amd64] }
        - { key: karpenter.k8s.aws/instance-category, operator: In, values: [c, m, r] }
        - { key: karpenter.k8s.aws/instance-generation, operator: Gt, values: ["5"] }
      expireAfter: 720h
  limits: { cpu: "200", memory: 800Gi }
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 2m
    budgets:
      - nodes: "10%"
      - nodes: "0"
        schedule: "0 13 * * 1-5"   # no voluntary disruption during the weekday peak (UTC)
        duration: 4h
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: general
spec:
  role: KARPENTER_NODE_ROLE        # set per env by the Argo app (terraform output karpenter_node_role)
  amiSelectorTerms: [{ alias: bottlerocket@latest }]
  subnetSelectorTerms: [{ tags: { karpenter.sh/discovery: CLUSTER_NAME } }]
  securityGroupSelectorTerms: [{ tags: { karpenter.sh/discovery: CLUSTER_NAME } }]
  metadataOptions: { httpTokens: required, httpPutResponseHopLimit: 1 }
  blockDeviceMappings:
    - deviceName: /dev/xvdb
      ebs: { volumeSize: 50Gi, volumeType: gp3, encrypted: true }
