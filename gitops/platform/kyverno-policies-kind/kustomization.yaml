# kind: same policies, image signature check in Audit (local unsigned images).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../kyverno-policies]
patches:
  - target: { kind: ClusterPolicy, name: verify-image-signatures }
    patch: |-
      - op: replace
        path: /spec/rules/0/verifyImages/0/failureAction
        value: Audit
