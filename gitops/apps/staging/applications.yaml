apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-load-balancer-controller
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "-10" }
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://aws.github.io/eks-charts
    chart: aws-load-balancer-controller
    targetRevision: 3.6.1
    helm:
      valuesObject:
        clusterName: CLUSTER_NAME
        serviceAccount: { annotations: { eks.amazonaws.com/role-arn: LBC_ROLE_ARN } }
  destination: { server: https://kubernetes.default.svc, namespace: kube-system }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nats
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "-5" }
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://nats-io.github.io/k8s/helm/charts/
    chart: nats
    targetRevision: 2.15.1
    helm:
      valuesObject:
        config: { cluster: { enabled: true, replicas: 3 }, jetstream: { enabled: true, fileStore: { pvc: { size: 20Gi } } } }
        podTemplate: { topologySpreadConstraints: { topology.kubernetes.io/zone: { maxSkew: 1, whenUnsatisfiable: DoNotSchedule } } }
  destination: { server: https://kubernetes.default.svc, namespace: orderflow }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
---
