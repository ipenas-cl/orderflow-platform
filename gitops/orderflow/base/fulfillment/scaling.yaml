# Queue-driven service: scale on JetStream consumer lag (work waiting),
# with CPU as a second trigger. KEDA manages the HPA for the Rollout.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: fulfillment
spec:
  scaleTargetRef: { apiVersion: argoproj.io/v1alpha1, kind: Rollout, name: fulfillment }
  minReplicaCount: 2
  maxReplicaCount: 6
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown: { stabilizationWindowSeconds: 60 }
  triggers:
    - type: nats-jetstream
      metadata:
        natsServerMonitoringEndpoint: nats.orderflow.svc.cluster.local:8222
        account: $G
        stream: ORDERFLOW
        consumer: fulfillment
        lagThreshold: "20"
        activationLagThreshold: "1"
    - type: cpu
      metricType: Utilization
      metadata: { value: "70" }
