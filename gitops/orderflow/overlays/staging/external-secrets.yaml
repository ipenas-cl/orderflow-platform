# DB credentials come from Secrets Manager (Aurora-managed master secret,
# replicated to the DR region) through External Secrets; nothing is in git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: orderflow-db
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target:
    name: orderflow-db
    creationPolicy: Owner
    template:
      data:
        host: "{{ .host }}"
        username: "{{ .username }}"
        password: "{{ .password }}"
        sslmode: verify-full
  dataFrom:
    - extract: { key: orderflow/staging/aurora }
