apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: orderflow
resources:
  - ../../base
  - external-secrets.yaml
images:
  - name: ghcr.io/ipenas-cl/orderflow/orders
    newTag: sha-0000000
  - name: ghcr.io/ipenas-cl/orderflow/payments
    newTag: sha-0000000
  - name: ghcr.io/ipenas-cl/orderflow/inventory
    newTag: sha-0000000
  - name: ghcr.io/ipenas-cl/orderflow/fulfillment
    newTag: sha-0000000
  - name: ghcr.io/ipenas-cl/orderflow/admin
    newTag: sha-0000000
  - name: ghcr.io/ipenas-cl/orderflow/payprovider
    newTag: sha-0000000
  - name: ghcr.io/ipenas-cl/orderflow/devissuer
    newTag: sha-0000000
patches:
  - target: { kind: Rollout }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target: { kind: ScaledObject }
    patch: |-
      - op: replace
        path: /spec/minReplicaCount
        value: 1
      - op: replace
        path: /spec/maxReplicaCount
        value: 3
  - target: { kind: HorizontalPodAutoscaler }
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3
  - target: { kind: ServiceAccount, name: payments }
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          eks.amazonaws.com/role-arn: arn:aws:iam::111111111111:role/orderflow-dev-use1-payments
  - target: { kind: Rollout, name: admin }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: OIDC_ISSUER, value: "https://orderflow-dev.us.auth0.com/" }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: OIDC_JWKS_URL, value: "https://orderflow-dev.us.auth0.com/.well-known/jwks.json" }
