apiVersion: apps/v1
kind: Deployment
metadata:
  name: devissuer
  labels: { app.kubernetes.io/name: devissuer, app.kubernetes.io/part-of: orderflow-deps }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: devissuer } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: devissuer, app.kubernetes.io/part-of: orderflow-deps }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: app
          image: ghcr.io/ipenas-cl/orderflow/devissuer:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - { name: ISSUER, value: "http://devissuer:9000/" }
            - { name: AUDIENCE, value: "orderflow-admin" }
          ports: [{ name: http, containerPort: 9000 }]
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /.well-known/jwks.json, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /.well-known/jwks.json, port: http }
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: devissuer
spec:
  selector: { app.kubernetes.io/name: devissuer }
  ports: [{ name: http, port: 9000, targetPort: http }]
