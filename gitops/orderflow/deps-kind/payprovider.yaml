apiVersion: apps/v1
kind: Deployment
metadata:
  name: payprovider
  labels: { app.kubernetes.io/name: payprovider, app.kubernetes.io/part-of: orderflow-deps }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: payprovider } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: payprovider, app.kubernetes.io/part-of: orderflow-deps }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: app
          image: ghcr.io/ipenas-cl/orderflow/payprovider:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - { name: FAILURE_RATE, value: "0.02" }
            - { name: DECLINE_RATE, value: "0.05" }
          ports: [{ name: http, containerPort: 8090 }]
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: payprovider
spec:
  selector: { app.kubernetes.io/name: payprovider }
  ports: [{ name: http, port: 8090, targetPort: http }]
