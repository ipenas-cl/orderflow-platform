# 2-node kind cluster labelled as two zones, so topology spread constraints
# and PDBs behave like a multi-AZ cluster. The control plane also schedules
# workloads (its taint is removed by proof/up.sh) to keep the box footprint
# small: every extra node pulls every DaemonSet image again.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: orderflow
networking:
  # nftables proxier: the iptables proxier needs the xt_statistic module for
  # multi-endpoint services, which some hosts/VMs (this box included) lack.
  kubeProxyMode: nftables
nodes:
  - role: control-plane
    labels: { topology.kubernetes.io/zone: zone-a }
    extraMounts: [{ hostPath: REPO_PATH, containerPath: /repo, readOnly: true }]
  - role: worker
    labels: { topology.kubernetes.io/zone: zone-b }
    extraMounts: [{ hostPath: REPO_PATH, containerPath: /repo, readOnly: true }]
