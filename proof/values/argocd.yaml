# Minimal Argo CD: no dex/notifications/applicationset, single replicas.
dex: { enabled: false }
notifications: { enabled: false }
applicationSet: { replicas: 0 }
redis: { resources: { limits: { memory: 128Mi } } }
configs:
  params:
    server.insecure: true
    controller.diff.server.side: "true"   # diff like kubectl --server-side (no false OutOfSync on defaulted fields)
  cm:
    timeout.reconciliation: 30s
